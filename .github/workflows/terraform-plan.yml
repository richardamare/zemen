name: terraform-plan

on:
  pull_request:
    paths:
      - infra/**
      - .github/actions/terraform-init/**
      - .github/workflows/terraform-plan.yml

permissions:
  contents: read

jobs:
  plan:
    # Fork and Dependabot runs receive no environment secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: staging-plan
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/terraform-init
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: zemen-staging-plan
      # The repository is public, so the log carries only resource addresses and actions.
      - working-directory: infra
        run: |
          # shellcheck disable=SC2016
          terraform plan -input=false -no-color -lock=false -out=tfplan > "$RUNNER_TEMP/plan.log" 2>&1 \
            || { cat "$RUNNER_TEMP/plan.log"; exit 1; }
          terraform show -json tfplan | jq -r '(.resource_changes // [])[]
            | select(.change.actions != ["no-op"])
            | "- `\(.address)`: \(.change.actions | join(", "))"' > "$RUNNER_TEMP/summary.md"
          { echo '### `infra`'; echo; if [ -s "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md"; else echo 'No changes.'; fi; } >> "$GITHUB_STEP_SUMMARY"
