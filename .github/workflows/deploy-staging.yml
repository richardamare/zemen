name: deploy-staging

on:
  push:
    branches: [master]
    paths:
      - apps/web/**
      - infra/**
      - pnpm-lock.yaml
      - .github/actions/terraform-init/**
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:

permissions:
  contents: read

# An interrupted apply can leave state and live resources apart, so a newer run waits instead of cancelling.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - uses: ./.github/actions/terraform-init
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: zemen-staging-apply
      # The repository is public, so tool output reaches the log only when a step fails.
      - name: Apply infra
        working-directory: infra
        run: |
          terraform apply -input=false -no-color -auto-approve > "$RUNNER_TEMP/apply.log" 2>&1 \
            || { cat "$RUNNER_TEMP/apply.log"; exit 1; }
          database_id="$(terraform output -raw database_id)"
          echo "::add-mask::$database_id"
          sed -i "s/\"database_id\": \"local\"/\"database_id\": \"$database_id\"/" ../apps/web/wrangler.jsonc
          grep -q "\"database_id\": \"$database_id\"" ../apps/web/wrangler.jsonc
      - name: Apply migrations
        working-directory: apps/web
        run: |
          pnpm exec wrangler d1 migrations apply zemen-staging --remote > "$RUNNER_TEMP/migrate.log" 2>&1 \
            || { cat "$RUNNER_TEMP/migrate.log"; exit 1; }
      - name: Deploy the Worker
        working-directory: apps/web
        run: |
          pnpm exec wrangler deploy > "$RUNNER_TEMP/deploy.log" 2>&1 \
            || { cat "$RUNNER_TEMP/deploy.log"; exit 1; }
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          echo "::add-mask::$url"
          test "$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$url/")" = zemen
