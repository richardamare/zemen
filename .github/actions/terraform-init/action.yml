name: terraform init
description: Loads an environment's Cloudflare credentials from 1Password and initializes infra against its state bucket.

inputs:
  op-service-account-token:
    description: Service account token that can read the vault.
    required: true
  vault:
    description: 1Password vault holding the cloudflare item.
    required: true

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.15.5
        terraform_wrapper: false
    - uses: 1password/load-secrets-action@v5
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}
        CLOUDFLARE_API_TOKEN: op://${{ inputs.vault }}/cloudflare/api_token
        CLOUDFLARE_ACCOUNT_ID: op://${{ inputs.vault }}/cloudflare/account_id
        TF_VAR_account_id: op://${{ inputs.vault }}/cloudflare/account_id
        STATE_BUCKET: op://${{ inputs.vault }}/cloudflare/state_bucket
        AWS_ACCESS_KEY_ID: op://${{ inputs.vault }}/cloudflare/r2_access_key_id
        AWS_SECRET_ACCESS_KEY: op://${{ inputs.vault }}/cloudflare/r2_secret_access_key
    - shell: bash
      working-directory: infra
      run: |
        terraform init -input=false -lockfile=readonly \
          -backend-config="bucket=$STATE_BUCKET" \
          -backend-config="endpoints={s3=\"https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com\"}"
